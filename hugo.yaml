baseURL: https://example.org/
languageCode: en-us
title: to(dev🧊)
theme: PaperMod
copyright: "© 2026 [Dev Desai](https://devddesai.github.io/)"

params:
  defaultTheme: light
  ShowReadingTime: true
  ShowCopyCodeButtons: true
  math: true
  author: ["Dev Desai"]
  assets: 
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
    favicon: /assets/favicon.ico

  homeInfoParams:
    Image: images/profile.jpg  # under assets/; remove this line to hide the photo
    Title: Hey there!
    Content: >-
      I'm Dev, and I'm an AI researcher at Harvard SEAS doing a Master's in CSE. Previously, I studied physics at UT Austin.
      I'm interested in mechanistic interpretability, AI safety, RL envs, and ML algorithms research.
      Apart from this, I'm a coffee nerd (casabrews, v60+baratza, K7 all the way), and am getting into tennis and photography.
      If you are interested in any of the above, I would love to [connect](mailto:devdesai@g.harvard.edu) (over a cup of coffee, maybe?)
  socialIcons:
    - name: email
      url: 'mailto:devdesai@g.harvard.edu'
    - name: github
      url: 'https://github.com/devddesai'
    - name: linkedin
      url: 'https://linkedin.com/in/dev-v-desai/'

menu:
  main:
  - identifier: home
    name: Home
    url: /
    weight: 10
  - identifier: projects
    name: Projects
    url: /categories/projects/
    weight: 20
  - identifier: notes
    name: Notes
    url: /categories/notes/
    weight: 30
  - identifier: postcards
    name: Postcards
    url: /postcards/
    weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        enable: true